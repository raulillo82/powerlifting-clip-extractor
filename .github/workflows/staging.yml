name: Staging

# Chooses what staging runs by writing the branch name to the deploy-state
# branch. The server polls that branch and does the deploy itself (see
# ansible/files/powerlifting-deploy.sh): nothing here runs on the server.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to staging, or "none"'
        required: true
        type: string

permissions: {}

jobs:
  select:
    # Dependabot pull requests must not take staging over: they open on their
    # own, and a rebuild would interrupt whatever staging is running.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-state

      - name: Update the staging branch
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          current=$(cat staging_branch)
          if [ -n "$INPUT_BRANCH" ]; then
            target=$INPUT_BRANCH
          elif [ "$EVENT_ACTION" != closed ]; then
            target=$HEAD_REF
          elif [ "$current" = "$HEAD_REF" ]; then
            target=none
          else
            target=$current
          fi

          if ! [[ "$target" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid branch name"
            exit 1
          fi
          if [ "$target" = "$current" ]; then
            echo "Staging already set to $target"
            exit 0
          fi

          printf '%s\n' "$target" > staging_branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Staging: $target"
          git push origin deploy-state
