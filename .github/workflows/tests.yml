name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - 'prompt.txt'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'prompt.txt'
      - '.gitignore'

permissions:
  contents: read

jobs:
  test:
    # arm64, like the server: the job also builds the image that gets deployed
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip3 install pytest ruff==0.17.3 -r requirements.txt

      - run: ruff check .

      - run: pytest test_extract_lifts.py test_app.py test_deploy.py -v

      - name: Build the image
        run: podman build -t powerlifting-ci .

      - name: Check the tools inside the image
        run: podman run --rm powerlifting-ci sh -c 'ffmpeg -version && yt-dlp --version'

      - name: Start the image the way the server does
        run: |
          mkdir ci-lifts
          podman run -d --name powerlifting-ci \
            --userns keep-id:uid=1000,gid=1000 \
            --cap-drop all \
            --security-opt no-new-privileges \
            -e HOME=/tmp \
            -p 127.0.0.1:5000:5000 \
            -v "$PWD/ci-lifts:/app/lifts" \
            powerlifting-ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/login; then
              exit 0
            fi
            sleep 1
          done
          podman logs powerlifting-ci
          exit 1
