version: 2
# Dependabot only reaches registries listed here, even public ones
registries:
  opensuse:
    type: docker-registry
    url: https://registry.opensuse.org
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    registries:
      - opensuse
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
